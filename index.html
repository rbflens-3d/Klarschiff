<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gebäudebetrachter</title>
    <!-- Lädt das Google-Viewer-Script (Draco-kompatibel) -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
        model-viewer { width: 100%; height: 100%; background-color: #ffffff; }
        
        /* Ein schicker Ladebalken, damit die Seite nicht weiß bleibt */
        #progress-bar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 4px;
            background-color: #e0e0e0;
            border-radius: 2px;
        }
        #update-bar {
            width: 0%;
            height: 100%;
            background-color: #007dfa;
            transition: width 0.3s;
        }
        .hide { display: none; }
    </style>
</head>
<body>

    <!-- Der optimierte Viewer mit Ladebalken-Verknüpfung und raw=1 -->
    <model-viewer 
        id="viewer"
        src="https://dropboxusercontent.com/scl/fi/szdcqpws17j31vp2w9lk6/Klarschiff.glb?rlkey=rm5soxpuzpzoq11f7oavugl4e&st=v5o5mnjt&dl=1" 
        ar 
        camera-controls 
        touch-action="pan-y" 
        alt="Komplexes Gebäude 3D"
        loading="eager">
        
        <!-- Das Lade-Element im Viewer -->
        <div id="progress-bar" slot="progress">
            <p style="text-align:center; font-family:sans-serif; font-size:14px; margin-top:-25px; color:#333;">Gebäude lädt...</p>
            <div id="update-bar"></div>
        </div>
    </model-viewer>

    <script>
        // Ladebalken-Logik steuern
        const modelViewer = document.querySelector('#viewer');
        const updateBar = document.querySelector('#update-bar');
        
        modelViewer.addEventListener('progress', (event) => {
            const progress = event.detail.totalProgress * 100;
            updateBar.style.width = `${progress}%`;
        });

        // 1. Rechtsklick auf der gesamten Seite sperren
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. F12 und Entwickler-Shortcuts blockieren
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
               (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };
    </script>
</body>
</html>
