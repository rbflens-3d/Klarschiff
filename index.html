<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; Klarschiff</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="Klarschiff-final.glb" ar ar-modes="webxr scene-viewer quick-look" 
      
      camera-controls tone-mapping="aces" 
      camera-target="0m 0m 0m" 
      camera-orbit="140deg 75deg 100m" 
      min-camera-orbit="auto 15deg 30m" 
      max-camera-orbit="auto 88deg 100m" 
      field-of-view="25deg" 
      min-field-of-view="10deg" 
      max-field-of-view="45deg" 
      zoom-sensitivity="0.40" 
      
      poster="poster.webp" shadow-intensity="1.01" exposure="1.27" environment-image="legacy">
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  
    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  </body>
</html>
