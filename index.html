<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #e8ecef;
  }
  model-viewer {
    width: 100vw;
    height: 100vh;
    display: block;
  }
</style>
    
    <!-- link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    
 <model-viewer 
  src="Klarschiff-final.glb" 
  camera-controls 
  camera-target="0m 0m 0m" 
  camera-orbit="265deg 80deg 50m" 
  min-camera-orbit="auto 15deg 8m" 
  max-camera-orbit="auto 85deg 90m" 
  field-of-view="25deg" 
  min-field-of-view="10deg" 
  max-field-of-view="45deg" 
  zoom-sensitivity="0.25" 
  shadow-intensity="1">
</model-viewer>


      
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  
    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  </body>
</html>
